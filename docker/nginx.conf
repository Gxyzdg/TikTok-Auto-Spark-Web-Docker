# WebSocket 升级映射（放在 http 上下文，nginx 会把 conf.d/*.conf 包含进 http 块）
# 用于登录向导的 CDP 画面串流：/api/Api/Screen/Stream
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    # default_server：确保本配置胜过镜像里 Debian 默认站点（sites-enabled/default）
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 前端 SPA（history 路由回退）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api 反向代理到后端（去掉 /api 前缀，与后端路由匹配）
    location /api/ {
        proxy_pass http://127.0.0.1:9844/;
        proxy_http_version 1.1;
        # 画面串流是 WebSocket：必须转发 Upgrade/Connection，否则握手失败
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 60s;
        proxy_read_timeout 3600s;  # 画面串流是长连接（普通请求也用不到这么久，无害）
        proxy_send_timeout 3600s;
        proxy_buffering off;       # 串流帧即时转发，不缓冲
    }
}
