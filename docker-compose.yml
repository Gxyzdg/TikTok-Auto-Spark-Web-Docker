services:
  app:
    build: .
    image: gxyzdg/tiktok-spark-auto-web-for-docker:latest
    container_name: tiktok-spark
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-14320}:80"      # 前端页面入口（默认 14320）
      - "${NOVNC_PORT:-14321}:6080"  # noVNC 网页版 VNC（默认 14321；使用「无 VNC」镜像时可删掉本行）
      # - "${API_PORT:-9844}:9844"   # 后端直连：普通使用不需要，仅在调试/直连接口时打开
    environment:
      # 端口变量只影响界面展示：首页的「前端端口 / noVNC 端口」会自动跟随实际访问地址；
      # 后端端口不映射时**不要**设置 API_PORT，界面会隐藏「API 地址」这一行。
      NOVNC_PORT: "${NOVNC_PORT:-14321}"
      # API_PORT: "9844"             # 仅在上面打开了后端端口映射时才需要
      # VNC 密码（默认 123456，正式使用前请修改）
      VNC_PASSWORD: "123456"
      # VNC_ENABLED=0 关闭 x11vnc / noVNC（改用登录向导内置的画面串流）。
      # 带 VNC 的镜像默认 1；「无 VNC」镜像（:1.5.1）已内置为 0，无需在此设置。
      VNC_ENABLED: "1"
    volumes:
      - spark-tasks:/data    # 定时任务 + 管理员密码持久化（重建容器不丢失）
    # 资源上限：Chromium 长期运行内存会涨，加上限可避免宿主 OOM 时连累其它服务
    mem_limit: 3g
    shm_size: 1g             # Chromium 需要足够的 /dev/shm
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    # 抖音需可访问外网（默认桥接网络即可）；如需固定出口 IP 请自行调整网络

volumes:
  spark-tasks:
