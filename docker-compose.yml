services:
  app:
    build: .
    image: gxyzdg/tiktok-spark-auto-web-for-docker:latest
    container_name: tiktok-spark
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"   # 前端页面入口（服务器禁 80，默认 8080；可用 WEB_PORT 环境变量改）
      - "0.0.0.0:6080:6080"      # noVNC 网页版 VNC（浏览器访问 http://IP:6080/）
      - "0.0.0.0:9844:9844"      # 后端直连任意地址访问（调试/接口直调用）
    environment:
      # 唯一需要配置的变量：改这里即可改 VNC 密码（默认 123456，正式使用前请修改）。
      # 其余运行参数（HOST/PORT/驱动路径/持久化路径等）已内置镜像默认值，一般无需配置。
      VNC_PASSWORD: "123456"
    volumes:
      - spark-tasks:/data    # 定时任务 + 管理员密码持久化（重建容器不丢失）
    # 抖音需可访问外网（默认桥接网络即可）；如需固定出口 IP 请自行调整网络

volumes:
  spark-tasks:
